name: Daily run

on:
  schedule:
    # Runs every day at 06:00 UTC (note: GitHub cron is always UTC)
    - cron: "0 6 * * *"
  workflow_dispatch:  # lets you trigger it manually from the Actions tab for testing

jobs:
  run-main:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # match the version in your pyproject.toml / pyenv

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtual environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run main.py
        run: poetry run python main.py
