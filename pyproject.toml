[tool.poetry]
name = "crater-classifier"
version = "0.1.0"
description = "Binary CNN image classifier for cratered vs non-cratered terrain"
authors = ["Matt Colborn"]
packages = [{ include = "*", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
torch = "*"
torchvision = "*"
matplotlib = "*"
pillow = "*"
jupyter = "*"
ipykernel = "*"
streamlit = "^1.58.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "ruff (>=0.15.17,<0.16.0)"
]
